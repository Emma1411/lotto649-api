name: Scraper Lotto 6/49

on:
  schedule:
    # Mercredi et samedi à 23h00 EST (4h00 UTC le lendemain)
    - cron: '0 4 * * 4'   # jeudi 4h UTC = mercredi 23h EST
    - cron: '0 4 * * 0'   # dimanche 4h UTC = samedi 23h EST
  workflow_dispatch:       # permet de lancer manuellement

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 psycopg2-binary python-dotenv

      - name: Lancer le scraper
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          python src/scraping/scraper_2026.py